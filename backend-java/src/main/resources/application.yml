server:
  port: 8080
  error:
    include-message: always

mythosforge:
  writer:
    base-url: http://127.0.0.1:8000
  export:
    root: ${MYTHOSFORGE_EXPORT_ROOT:exports}
  internal:
    api-token: ${MYTHOSFORGE_INTERNAL_TOKEN:dev-internal-token}
  generation:
    # 同一章连续 FAILED 任务达到该值后拒绝新入队（0=关闭熔断）
    consecutive-failed-jobs-to-block-enqueue: 5
  narrative:
    # 子文本「建议回收章」窗口半径（±N 章）；项目 narrative_accept_policy_json 可覆盖
    subtext-window-radius: 1

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mythosforge}
    username: ${POSTGRES_USER:mythosforge}
    password: ${POSTGRES_PASSWORD:mythosforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Genre 422/502 排查：出站 RestClient + WriterEngineClient 调试日志
logging:
  level:
    com.mythosforge.writer.WriterEngineClient: DEBUG
    org.springframework.web.client.RestClient: DEBUG
