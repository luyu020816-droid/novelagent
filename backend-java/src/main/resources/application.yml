server:
  port: 8080

mythosforge:
  writer:
    base-url: http://127.0.0.1:8000

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mythosforge}
    username: ${POSTGRES_USER:mythosforge}
    password: ${POSTGRES_PASSWORD:mythosforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
